{% extends "base.html" %}
{% load socialaccount %}
{% block content %}
  <h1>Iniciar sesión</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Entrar</button>
  </form>

  {% get_providers as socialaccount_providers %}
  {% if socialaccount_providers %}
    <p style="margin:16px 0 8px">o</p>
    <a class="btn btn-outline" href="{% provider_login_url 'google' %}">Iniciar sesión con Google</a>
  {% endif %}
{% endblock %}
